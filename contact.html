<head>
    <meta charset="UTF-8">

    <title>Contact | Devapriya Anil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .contact-box {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            height: 100%;
            transition: transform 0.3s;
        }
        .contact-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255,255,255,0.15);
        }
        .contact-icon {
            font-size: 2.5rem;
            color: var(--accent-1);
            margin-bottom: 1rem;
            display: inline-block;
            text-shadow: 0 0 10px var(--neon-glow);
        }
        .contact-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
            transition: color 0.3s;
        }
        .contact-link:hover {
            color: var(--accent-1);
        }
        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.8rem 1rem;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent-1);
            color: var(--text-main);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>

<div class="container page-wrapper">
    <h2 class="section-title text-gradient text-center mb-5">Get In Touch</h2>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="contact-box">
                <i class="bi bi-envelope-check contact-icon"></i>
                <h4>Email</h4>
                <a href="mailto:devapriyaanil373@gmail.com" class="contact-link">devapriyaanil373@gmail.com</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="contact-box">
                <i class="bi bi-linkedin contact-icon"></i>
                <h4>LinkedIn</h4>
                <a href="https://www.linkedin.com/in/devapriya-anil/" target="_blank" class="contact-link">in/devapriya-anil</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="contact-box">
                <i class="bi bi-telephone-fill contact-icon"></i>
                <h4>Mobile</h4>
                <a href="tel:+918301019520" class="contact-link">+91-8301019520</a>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-panel text-center p-4 p-md-5">
                <h3 class="mb-4 text-gradient">Send a Message</h3>
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control rounded-pill" placeholder="Your Name" required>
                        </div>
                        <div class="col-md-6">
                            <input type="email" class="form-control rounded-pill" placeholder="Your Email" required>
                        </div>
                        <div class="col-12">
                            <input type="text" class="form-control rounded-pill" placeholder="Subject">
                        </div>
                        <div class="col-12">
                            <textarea class="form-control rounded-4" rows="5" placeholder="Your Message" required style="resize: none;"></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-neon w-100">Send Message</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
